<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biotech Research Digest</title>
<style>
  :root {
    --navy: #1F3864;
    --navy2: #2E4DA3;
    --accent: #4F6FD4;
    --bg: #F4F6FB;
    --card: #ffffff;
    --band: #EEF2FF;
    --border: #D4DCF0;
    --green: #C6EFCE;
    --green-text: #276221;
    --yellow: #FFEB9C;
    --yellow-text: #7D5A00;
    --pink: #FFCCCC;
    --pink-text: #9C0006;
    --muted: #6B7A9B;
    --text: #1a2340;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
    color: white;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(31,56,100,0.18);
  }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
  header .meta { font-size: 0.78rem; opacity: 0.75; margin-top: 4px; }
  #reload-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    transition: background 0.15s;
  }
  #reload-btn:hover { background: rgba(255,255,255,0.25); }

  .filters {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .filter-label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
  .chip {
    padding: 5px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
    font-weight: 500;
  }
  .chip.active { background: var(--navy); border-color: var(--navy); color: white; }
  .chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .stats-bar {
    padding: 10px 32px;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .stats-bar strong { color: var(--text); }

  .grid {
    padding: 0 32px 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: box-shadow 0.15s, transform 0.1s;
  }
  .card:hover { box-shadow: 0 4px 18px rgba(31,56,100,0.12); transform: translateY(-1px); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-title { font-weight: 600; font-size: 0.9rem; line-height: 1.4; flex: 1; }
  .card-title a { color: var(--navy2); text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }

  .score-badge {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem;
  }
  .score-5 { background: var(--green); color: var(--green-text); }
  .score-4 { background: var(--yellow); color: var(--yellow-text); }
  .score-3 { background: var(--pink); color: var(--pink-text); }

  .card-summary { font-size: 0.82rem; color: #444; line-height: 1.5; }

  .card-footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .tag {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;
    background: var(--band); color: var(--navy2); font-weight: 600;
    border: 1px solid #c8d4f8;
  }
  .tag.source { background: #f0f4ff; color: var(--muted); font-weight: 500; }
  .date-tag { font-size: 0.7rem; color: var(--muted); margin-left: auto; }

  .loading { text-align: center; padding: 80px 32px; color: var(--muted); font-size: 1rem; }
  .error-msg { text-align: center; padding: 60px 32px; color: #9C0006; }
  .empty { text-align: center; padding: 60px 32px; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 640px) {
    header { padding: 18px 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .filters, .stats-bar { padding: 12px 16px; }
    .grid { padding: 0 16px 24px; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🔬 Biotech Research Digest</h1>
    <div class="meta" id="header-meta">Loading…</div>
  </div>
  <button id="reload-btn" onclick="loadData()">↻ Refresh</button>
</header>

<div class="filters" id="filters"></div>
<div class="stats-bar" id="stats-bar"></div>
<div class="grid" id="grid"><div class="loading">Loading articles…</div></div>

<script>
const DATA_URL = 'data.json';

const TOPICS = [
  'AAV / LNP',
  'Antibody & Protein',
  'AI/ML',
  'Competitive',
  'Potency & Bioassays',
  'Biotools & Research Tools',
  'Regulatory / FDA'
];
const SOURCES = ['PubMed', 'bioRxiv', 'Web'];

let allArticles = [];
let activeTopic = 'All';
let activeSource = 'All';
let activeScore = 'All';

async function loadData() {
  document.getElementById('grid').innerHTML = '<div class="loading">Loading articles…</div>';
  document.getElementById('header-meta').textContent = 'Loading…';
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    allArticles = (data.articles || []).sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return (b.date || '').localeCompare(a.date || '');
    });
    const latest = allArticles.map(a => a.date).filter(Boolean).sort().reverse()[0] || '';
    document.getElementById('header-meta').textContent =
      `${allArticles.length} articles · last updated ${data.generated || latest}`;
    buildFilters();
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="error-msg">⚠️ Could not load data.json<br><small>${e.message}</small></div>`;
    document.getElementById('header-meta').textContent = 'Error loading data';
  }
}

function buildFilters() {
  const f = document.getElementById('filters');
  const makeChip = (label, group, val) => {
    const d = document.createElement('button');
    d.className = 'chip' + (val === (group === 'topic' ? activeTopic : group === 'source' ? activeSource : activeScore) ? ' active' : '');
    d.textContent = label;
    d.onclick = () => {
      if (group === 'topic') activeTopic = val;
      else if (group === 'source') activeSource = val;
      else activeScore = val;
      buildFilters();
      render();
    };
    return d;
  };

  f.innerHTML = '';
  const tl = document.createElement('span'); tl.className = 'filter-label'; tl.textContent = 'Topic';
  f.appendChild(tl);
  f.appendChild(makeChip('All', 'topic', 'All'));
  TOPICS.forEach(t => f.appendChild(makeChip(t, 'topic', t)));

  const sep = document.createElement('div'); sep.className = 'sep'; f.appendChild(sep);
  const sl = document.createElement('span'); sl.className = 'filter-label'; sl.textContent = 'Source';
  f.appendChild(sl);
  f.appendChild(makeChip('All', 'source', 'All'));
  SOURCES.forEach(s => f.appendChild(makeChip(s, 'source', s)));

  const sep2 = document.createElement('div'); sep2.className = 'sep'; f.appendChild(sep2);
  const scl = document.createElement('span'); scl.className = 'filter-label'; scl.textContent = 'Score';
  f.appendChild(scl);
  ['All', '5', '4', '3'].forEach(s => f.appendChild(makeChip(s === 'All' ? 'All' : '★' + s, 'score', s)));
}

function render() {
  const filtered = allArticles.filter(a => {
    if (activeTopic !== 'All' && a.topic !== activeTopic) return false;
    if (activeSource !== 'All' && a.source !== activeSource) return false;
    if (activeScore !== 'All' && String(a.score) !== activeScore) return false;
    return true;
  });

  document.getElementById('stats-bar').innerHTML =
    `Showing <strong>${filtered.length}</strong> of ${allArticles.length} articles` +
    (activeTopic !== 'All' || activeSource !== 'All' || activeScore !== 'All'
      ? ` &nbsp;·&nbsp; <a href="#" onclick="clearFilters(); return false;" style="color:var(--accent);font-size:0.8rem">Clear filters</a>` : '');

  if (!filtered.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">No articles match the current filters.</div>';
    return;
  }

  document.getElementById('grid').innerHTML = filtered.map(a => {
    const scoreClass = a.score === 5 ? 'score-5' : a.score === 4 ? 'score-4' : 'score-3';
    const titleHtml = a.url
      ? `<a href="${escHtml(a.url)}" target="_blank" rel="noopener">${escHtml(a.title)}</a>`
      : escHtml(a.title);
    return `
    <div class="card">
      <div class="card-top">
        <div class="card-title">${titleHtml}</div>
        <div class="score-badge ${scoreClass}">${a.score}</div>
      </div>
      <div class="card-summary">${escHtml(a.summary)}</div>
      <div class="card-footer">
        <span class="tag">${escHtml(a.topic)}</span>
        <span class="tag source">${escHtml(a.source)}</span>
        <span class="date-tag">${a.date || ''}</span>
      </div>
    </div>`;
  }).join('');
}

function clearFilters() {
  activeTopic = 'All'; activeSource = 'All'; activeScore = 'All';
  buildFilters(); render();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadData();
</script>
</body>
</html>
